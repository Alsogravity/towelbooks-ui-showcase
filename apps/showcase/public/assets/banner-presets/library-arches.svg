<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <!-- Background wall gradient -->
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EADFC4" />
      <stop offset="100%" stop-color="#DCCFAF" />
    </linearGradient>

    <!-- Grand floor gradient -->
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6F4E37" />
      <stop offset="100%" stop-color="#3D2E1E" />
    </linearGradient>

    <!-- Center window sky gradient -->
    <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9E79" />
      <stop offset="100%" stop-color="#FFE099" />
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="400" height="100" fill="url(#wallGrad)" />

  <!-- Grand Wooden Floor -->
  <rect y="85" width="400" height="15" fill="url(#floorGrad)" />
  <line x1="0" y1="85" x2="400" y2="85" stroke="#2B1E16" stroke-width="1.2" />

  <!-- ==================== BACKGROUNDS INSIDE THE ARCHES ==================== -->
  <!-- Left Arch Backdrop: Dark bookshelf -->
  <rect x="35" y="44" width="46" height="41" fill="#2E231F" />
  <!-- Left bookshelf lines -->
  <line x1="35" y1="58" x2="81" y2="58" stroke="#1A1311" stroke-width="1.5" />
  <line x1="35" y1="72" x2="81" y2="72" stroke="#1A1311" stroke-width="1.5" />
  <!-- Left bookshelf books -->
  <!-- Shelf 1 -->
  <rect x="39" y="48" width="4" height="10" fill="#8B2E1F" />
  <rect x="44" y="46" width="5" height="12" fill="#B8893E" />
  <rect x="50" y="49" width="3" height="9" fill="#2F4A36" />
  <rect x="54" y="47" width="4" height="11" fill="#1A5F7A" />
  <rect x="59" y="48" width="4" height="10" fill="#B8893E" transform="rotate(8 59 48)" />
  <rect x="67" y="49" width="3" height="9" fill="#8B2E1F" />
  <rect x="71" y="47" width="5" height="11" fill="#2F4A36" />
  <!-- Shelf 2 -->
  <rect x="37" y="62" width="5" height="10" fill="#2F4A36" />
  <rect x="43" y="60" width="4" height="12" fill="#8B2E1F" />
  <rect x="48" y="63" width="5" height="9" fill="#B8893E" />
  <rect x="54" y="61" width="4" height="11" fill="#1A5F7A" />
  <rect x="59" y="63" width="3" height="9" fill="#8B2E1F" />
  <rect x="63" y="61" width="5" height="11" fill="#B8893E" />
  <rect x="69" y="62" width="4" height="10" fill="#2F4A36" transform="rotate(-12 69 62)" />


  <!-- Center Arch Backdrop: Grand arched window overlooking sunset -->
  <path d="M 148 85 L 148 35 A 27 27 0 0 1 202 35 L 202 85 Z" fill="url(#windowSky)" />
  <!-- Window frames -->
  <path d="M 148 35 A 27 27 0 0 1 202 35" fill="none" stroke="#3D2E1E" stroke-width="1.5" />
  <line x1="175" y1="8" x2="175" y2="85" stroke="#3D2E1E" stroke-width="1.5" />
  <line x1="148" y1="45" x2="202" y2="45" stroke="#3D2E1E" stroke-width="1.5" />
  <line x1="148" y1="65" x2="202" y2="65" stroke="#3D2E1E" stroke-width="1.2" />
  <!-- Sun glowing through center window -->
  <circle cx="175" cy="45" r="10" fill="#FFF" fill-opacity="0.4" />


  <!-- Right Arch Backdrop: Bookshelf in shadow -->
  <rect x="315" y="48" width="46" height="37" fill="#2E231F" />
  <!-- Right bookshelf lines -->
  <line x1="315" y1="64" x2="361" y2="64" stroke="#1A1311" stroke-width="1.5" />
  <!-- Shelf 1 (y=64) -->
  <rect x="319" y="52" width="5" height="12" fill="#B8893E" />
  <rect x="325" y="54" width="4" height="10" fill="#8B2E1F" />
  <rect x="330" y="51" width="5" height="13" fill="#2F4A36" />
  <rect x="336" y="53" width="4" height="11" fill="#1A5F7A" />
  <rect x="341" y="54" width="4" height="10" fill="#B8893E" transform="rotate(10 341 54)" />
  <rect x="349" y="53" width="3" height="11" fill="#8B2E1F" />
  <rect x="353" y="52" width="5" height="12" fill="#2F4A36" />
  <!-- Shelf 2 (Floor) -->
  <rect x="318" y="72" width="4" height="13" fill="#1A5F7A" />
  <rect x="323" y="74" width="5" height="11" fill="#B8893E" />
  <rect x="329" y="75" width="4" height="10" fill="#2F4A36" transform="rotate(-5 329 75)" />
  <rect x="336" y="73" width="5" height="12" fill="#8B2E1F" />
  <rect x="342" y="75" width="4" height="10" fill="#B8893E" />


  <!-- ==================== GRAND ARCHITECTURAL COLUMNS & ARCHES ==================== -->
  <!-- Left Pillar Structure -->
  <rect x="12" y="43" width="10" height="42" fill="#5C1E14" />
  <rect x="10" y="81" width="14" height="4" fill="#3A120C" />

  <!-- Left Terracotta Arch -->
  <path d="M 30 85 L 30 45 A 25 25 0 0 1 80 45 L 80 85 L 88 85 L 88 43 A 33 33 0 0 0 22 43 L 22 85 Z" fill="#8B2E1F" />
  <!-- Gold trim left arch -->
  <path d="M 22 43 A 33 33 0 0 1 88 43" fill="none" stroke="#B8893E" stroke-width="1.5" />

  <!-- Mid-Left Solid wall section with Golden Hanging Banner -->
  <rect x="88" y="28" width="44" height="57" fill="#5C1E14" />
  <rect x="88" y="81" width="44" height="4" fill="#3A120C" />
  <!-- Golden Banner -->
  <path d="M 100 35 L 120 35 L 120 65 L 110 58 L 100 65 Z" fill="#B8893E" />
  <!-- Emblem on banner -->
  <path d="M 106 43 L 114 43 L 114 51 L 110 55 L 106 51 Z" fill="#1A5F7A" />
  <circle cx="110" cy="47" r="1.5" fill="#B8893E" />

  <!-- Center Grand Terracotta Arch -->
  <path d="M 140 85 L 140 30 A 35 35 0 0 1 210 30 L 210 85 L 218 85 L 218 28 A 43 43 0 0 0 132 28 L 132 85 Z" fill="#A93D2A" />
  <!-- Gold trim center arch -->
  <path d="M 132 28 A 43 43 0 0 1 218 28" fill="none" stroke="#B8893E" stroke-width="2" />

  <!-- Mid-Right Massive Wall with Tall Built-in Bookshelf -->
  <rect x="218" y="28" width="96" height="57" fill="#5C1E14" />
  <rect x="218" y="81" width="96" height="4" fill="#3A120C" />
  <!-- Built-in Bookshelf inside Wall -->
  <rect x="235" y="32" width="62" height="53" fill="#2E231F" />
  <line x1="235" y1="45" x2="297" y2="45" stroke="#1A1311" stroke-width="1.5" />
  <line x1="235" y1="59" x2="297" y2="59" stroke="#1A1311" stroke-width="1.5" />
  <line x1="235" y1="73" x2="297" y2="73" stroke="#1A1311" stroke-width="1.5" />
  <!-- Books on built-in shelf -->
  <!-- Top Shelf (y=45) -->
  <rect x="238" y="35" width="4" height="10" fill="#8B2E1F" />
  <rect x="243" y="37" width="5" height="8" fill="#B8893E" />
  <rect x="249" y="34" width="4" height="11" fill="#2F4A36" />
  <rect x="254" y="36" width="3" height="9" fill="#1A5F7A" />
  <rect x="258" y="37" width="5" height="8" fill="#B8893E" transform="rotate(12 258 37)" />
  <rect x="268" y="35" width="4" height="10" fill="#8B2E1F" />
  <rect x="273" y="34" width="4" height="11" fill="#2F4A36" />
  <rect x="278" y="36" width="5" height="9" fill="#1A5F7A" />
  <!-- Middle Shelf (y=59) -->
  <rect x="239" y="49" width="5" height="10" fill="#2F4A36" />
  <rect x="245" y="47" width="4" height="12" fill="#8B2E1F" />
  <rect x="250" y="51" width="5" height="8" fill="#B8893E" />
  <rect x="256" y="48" width="4" height="11" fill="#1A5F7A" />
  <rect x="265" y="49" width="4" height="10" fill="#B8893E" />
  <rect x="270" y="47" width="4" height="12" fill="#8B2E1F" />
  <rect x="275" y="50" width="3" height="9" fill="#2F4A36" />
  <!-- Bottom Shelf (y=73) -->
  <rect x="237" y="63" width="4" height="10" fill="#1A5F7A" />
  <rect x="242" y="61" width="5" height="12" fill="#B8893E" />
  <rect x="248" y="63" width="4" height="10" fill="#2F4A36" transform="rotate(-8 248 63)" />
  <rect x="256" y="61" width="4" height="12" fill="#8B2E1F" />
  <rect x="261" y="64" width="5" height="9" fill="#B8893E" />
  <rect x="267" y="62" width="3" height="11" fill="#1A5F7A" />
  <rect x="271" y="61" width="5" height="12" fill="#2F4A36" />

  <!-- Right Grand Terracotta Arch -->
  <path d="M 320 85 L 320 50 A 20 20 0 0 1 360 50 L 360 85 L 366 85 L 366 48 A 26 26 0 0 0 314 48 L 314 85 Z" fill="#8B2E1F" />
  <!-- Gold trim right arch -->
  <path d="M 314 48 A 26 26 0 0 1 366 48" fill="none" stroke="#B8893E" stroke-width="1.2" />

  <!-- Right Pillar Structure -->
  <rect x="366" y="48" width="10" height="37" fill="#5C1E14" />
  <rect x="364" y="81" width="14" height="4" fill="#3A120C" />


  <!-- ==================== FOREGROUND DETAILS ==================== -->
  <!-- Cozy pile of books on the floor (left) -->
  <rect x="94" y="81" width="20" height="5" fill="#8B2E1F" rx="0.5" />
  <rect x="93" y="83" width="22" height="1" fill="#DCCFAF" /> <!-- pages -->
  
  <rect x="96" y="76" width="16" height="5" fill="#B8893E" rx="0.5" />
  <rect x="95" y="78" width="18" height="1" fill="#DCCFAF" /> <!-- pages -->
  
  <rect x="95" y="72" width="17" height="4" fill="#2F4A36" rx="0.5" />
  <rect x="94" y="74" width="19" height="1" fill="#DCCFAF" /> <!-- pages -->

  <!-- Small candle lamp lighting up the right floor -->
  <rect x="238" y="80" width="6" height="6" rx="1" fill="#B8893E" />
  <circle cx="241" cy="76" r="3" fill="#FFEBB3" fill-opacity="0.8" />
  <circle cx="241" cy="76" r="10" fill="#FFEBB3" fill-opacity="0.2" />
</svg>
