<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">East Asian reading room SVG illustration</title>
  <desc id="desc">Colorful SVG line-art with jade, gold, and coral stacked books, flowing reading lines, glowing red paper lanterns, sakura blossoms, soft blue cloud motifs, a vermillion torii-inspired gate, and a pagoda roof detail.</desc>
  <defs>
    <linearGradient id="lanternGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset=".45" stop-color="#ff9d4d"/>
      <stop offset="1" stop-color="#f2643a"/>
    </linearGradient>
    <radialGradient id="petalGlow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffd9e2"/>
      <stop offset="1" stop-color="#ff9eb8"/>
    </radialGradient>
    <style>
      /* structural strokes (default warm coral) */
      .line{stroke:#ff6b4a;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
      .thin{stroke:#ff6b4a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
      .soft{stroke:#ff8b72;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.9;}
      .dot{fill:#ff6b4a;}

      /* color overrides (declared after structural rules so they win) */
      .s-jade{stroke:#15827a;}
      .s-gold{stroke:#c98412;}
      .s-coral{stroke:#df4f2c;}
      .s-red{stroke:#d62828;}
      .s-pink{stroke:#e0628a;}
      .s-blue{stroke:#3f8fbf;}
      .s-indigo{stroke:#3d405b;}

      /* fills */
      .f-jade-1{fill:#74cbc1;}
      .f-jade-2{fill:#4eb6ab;}
      .f-jade-3{fill:#2c9489;}
      .f-gold-1{fill:#f9d784;}
      .f-gold-2{fill:#f4c451;}
      .f-gold-3{fill:#e3a72f;}
      .f-coral-1{fill:#ffb8a6;}
      .f-coral-2{fill:#ff957c;}
      .f-coral-3{fill:#ef6f51;}
      .f-glow{fill:url(#lanternGlow);}
      .f-petal{fill:url(#petalGlow);}
      .f-cloud{fill:#bfe3f2;opacity:.7;}
      .f-red{fill:#d62828;}
      .d-gold{fill:#e3a72f;}
      .d-pink{fill:#e0628a;}
      .d-jade{fill:#2c9489;}
    </style>
  </defs>

